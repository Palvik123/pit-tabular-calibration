[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pit-tabular-calibration"
version = "0.1.0"
description = "Strict Point-in-Time & Walk-Forward panel data validation with hybrid Elkan prior-odds and Isotonic probability calibration."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Palvan Yuldashev", email = "gerfonik98@gmail.com"}
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
